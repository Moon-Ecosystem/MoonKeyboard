name: Build and Release

on:
  push:
    branches: [main]
    # A version tag (v0.1, v0.2, …) publishes a public "Moon Keyboard <version>" release
    tags: ['v*']

permissions:
  contents: write # create the GitHub release

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - uses: gradle/actions/setup-gradle@v4

      - name: Install Android platform 36.1
        run: yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-36.1" > /dev/null

      - name: Unit tests
        run: ./gradlew :engine:test

      # Release signing reads the git-ignored local.properties (key alias "upload")
      - name: Write signing config
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          STORE_PASSWORD: ${{ secrets.STORE_PASSWORD }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ] || [ -z "$STORE_PASSWORD" ]; then
            echo "::error::Missing KEYSTORE_BASE64 or STORE_PASSWORD secret"; exit 1
          fi
          echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/upload.jks"
          printf '%s' "$STORE_PASSWORD" > "$RUNNER_TEMP/upload.password"
          {
            echo "sdk.dir=$ANDROID_HOME"
            echo "signing.storeFile=$RUNNER_TEMP/upload.jks"
            echo "signing.storePasswordFile=$RUNNER_TEMP/upload.password"
            echo "signing.keyAlias=upload"
          } > local.properties

      - name: Build release APK
        run: ./gradlew :app:assembleRelease

      # Version tag: "Moon Keyboard 0.1" as the latest release; main push: a numbered pre-release build
      - name: Name the release
        id: meta
        run: |
          if [ "$GITHUB_REF_TYPE" = tag ]; then
            version="${GITHUB_REF_NAME#v}"
            echo "tag=$GITHUB_REF_NAME" >> "$GITHUB_OUTPUT"
            echo "name=Moon Keyboard $version" >> "$GITHUB_OUTPUT"
            echo "apk=MoonKeyboard-$version.apk" >> "$GITHUB_OUTPUT"
            echo "prerelease=false" >> "$GITHUB_OUTPUT"
          else
            echo "tag=build-$GITHUB_RUN_NUMBER" >> "$GITHUB_OUTPUT"
            echo "name=Moon Keyboard build $GITHUB_RUN_NUMBER" >> "$GITHUB_OUTPUT"
            echo "apk=MoonKeyboard-$GITHUB_RUN_NUMBER.apk" >> "$GITHUB_OUTPUT"
            echo "prerelease=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Rename APK
        run: cp app/build/outputs/apk/release/app-release.apk "${{ steps.meta.outputs.apk }}"

      - uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.meta.outputs.tag }}
          name: ${{ steps.meta.outputs.name }}
          target_commitish: ${{ github.sha }}
          prerelease: ${{ steps.meta.outputs.prerelease }}
          generate_release_notes: true
          files: ${{ steps.meta.outputs.apk }}
